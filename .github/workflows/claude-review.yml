name: Claude PR review

# Automatic AI code review for the AI-driven development process
# (docs/ai-driven-development.md, Phase 3). It reviews each PR against the
# project's SDD artifacts and conventions, then posts inline comments.
#
# Gating: the review mode is chosen by the repository variable PR_REVIEW_MODE,
# mirroring PHASE_DISPATCH_MODE in phase-advance.yml (docs/ai-driven-development.md
# §5). Three values:
#   - `off` (default; also the value when the variable is unset) — no review runs
#     in CI, so opening a normal PR costs nothing. Run the `spec-reviewer`
#     subagent in-session instead.
#   - `oauth` — review on a Claude Pro/Max **subscription** OAuth token (secret
#     CLAUDE_CODE_OAUTH_TOKEN, minted with `claude setup-token`). No per-token
#     charge; draws on the subscription usage window.
#   - `api` — review on a pay-as-you-go **API** key (secret ANTHROPIC_API_KEY),
#     billed per token.
# The variable is checked in the job `if:`; the selected mode's secret cannot be
# referenced there, so it is mapped to an env var and checked in a step. When the
# secret is absent the job succeeds (green) and simply skips the review, so CI is
# never blocked (e.g. on forks).
#
# Requires the matching secret (CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY) and,
# recommended, the Claude GitHub App (https://github.com/apps/claude). Docs:
# https://code.claude.com/docs/en/github-actions

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # OFF by default: only runs when PR_REVIEW_MODE selects an automated mode.
    if: ${{ vars.PR_REVIEW_MODE == 'oauth' || vars.PR_REVIEW_MODE == 'api' }}
    steps:
      - name: Resolve credential for the selected mode
        id: check
        env:
          MODE: ${{ vars.PR_REVIEW_MODE }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$MODE" = "oauth" ]; then
            if [ -n "$OAUTH_TOKEN" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "PR_REVIEW_MODE=oauth but CLAUDE_CODE_OAUTH_TOKEN is not set; skipping review (CI stays green)."
            fi
          elif [ "$MODE" = "api" ]; then
            if [ -n "$API_KEY" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "PR_REVIEW_MODE=api but ANTHROPIC_API_KEY is not set; skipping review (CI stays green)."
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PR_REVIEW_MODE=$MODE is not an automated mode; skipping review."
          fi

      - name: Checkout
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        if: steps.check.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Exactly one credential is non-empty, selected by PR_REVIEW_MODE.
          claude_code_oauth_token: ${{ vars.PR_REVIEW_MODE == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ vars.PR_REVIEW_MODE == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          # Strong model for review judgement (model routing, see ADR-0004).
          claude_args: --model claude-opus-4-8
          prompt: |
            You are reviewing this pull request for a project that follows the
            AI-driven DDD/BDD/SDD/TDD process in docs/ai-driven-development.md.
            Focus the review on conformance to the approved specification, not
            just generic code quality:

            1. Spec conformance — does the implementation match the boundaries
               in the relevant features/sdd/*.spec.feature and docs/specs/*.md?
               Flag behavior in code that is absent from the spec, and spec
               scenarios with no covering test.
            2. Executable Gherkin — every new/changed .feature and .spec.feature
               has binding step definitions in tests/bdd/ (none orphaned).
            3. Contract — if endpoints/schemas changed, docs/api/openapi.json was
               regenerated (scripts/export_openapi.py) and the drift test passes.
            4. Ubiquitous language — names match docs/domain/glossary.md.
            5. Layering & harness — domain stays framework-light; no real
               LLM/DB/network in the default test suite (docs/testing.md).
            6. ADRs — the change does not silently reverse an accepted ADR in
               docs/adr/.

            Post concise inline comments grouped as Blocking / Should-fix / Nits,
            each citing file:line. End with a verdict: APPROVE,
            APPROVE WITH NITS, or REQUEST CHANGES.
