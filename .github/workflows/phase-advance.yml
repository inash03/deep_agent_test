name: Advance the phase pipeline

# Outer-loop automation for the DDD→BDD→SDD→TDD pipeline (docs/ai-driven-
# development.md §5, §9). The pipeline's state machine is externalized in
# Issues: `create-phase-subissues.yml` files four `phase-subissue`-labelled
# children per feature, and their open/closed state is the phase-completion
# tracker. This workflow drives the hand-off when a phase sub-issue closes.
#
# Two layers, by role:
#
#   1. SIGNAL (job `advance-phase`, deterministic, no AI) — mirrors the
#      philosophy of `create-phase-subissues.yml`: no tokens, no drift,
#      idempotent. It reads the closed sub-issue's phase (`[DDD]`/`[BDD]`/
#      `[SDD]`/`[TDD]` title prefix) and parent (`**Parent:** #N` body line —
#      the same conventions that workflow writes; do not invent new ones),
#      finds the next phase's sub-issue, and produces two outputs:
#        - a **comment on the next sub-issue** (the actionable ping: which skill
#          to run and its inputs), and
#        - a single **`phase:<next>` label on the parent** (a queryable
#          single-select current-phase status field; TDD close ⇒ `phase:done`).
#      The comment carries a marker so close → reopen → close never double-posts.
#
#   2. DISPATCH (job `dispatch-next-phase`, increment 2, AI) — starts an agent
#      session for the next phase so the hand-off advances without a human in
#      the hot path, WHILE KEEPING the per-phase human approval gate. It is
#      OFF by default and billed per token, so it is triple-gated: a fresh
#      hand-off, the repository variable `CLAUDE_API_AUTOMATION == 'true'`
#      (unset ⇒ off; flip on only for sessions you want auto-advanced), and the
#      `ANTHROPIC_API_KEY` secret. Absent any of these the job is a clean no-op
#      and only the increment-1 signal remains (no API spend). The agent commits
#      the artifact to a new branch and the action posts a PR-creation link on
#      the sub-issue; a human opens and reviews the draft PR. It never closes the
#      sub-issue or merges. Dispatch is tied to the SAME marker as the signal
#      comment, so it fires exactly once per hand-off. Recommended: install the
#      Claude GitHub App so the PR it produces triggers CI (a PR opened via
#      GITHUB_TOKEN alone does not).
#
# Phase order is NOT enforced (a human may close sub-issues out of order; the
# parent label may then move backwards, which is acceptable). The human gate at
# every phase boundary is preserved — this workflow never auto-approves,
# auto-merges, or auto-closes.

on:
  issues:
    types: [closed]

concurrency:
  # Serialise runs for the same issue, mirroring create-phase-subissues.yml, so
  # a rapid close → reopen → close cannot race the idempotency check.
  group: phase-advance-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  advance-phase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # Guard: only act on closed sub-issues that carry the `phase-subissue`
    # label. A non-phase issue closing must not signal or dispatch anything.
    if: contains(github.event.issue.labels.*.name, 'phase-subissue')
    outputs:
      # `dispatch` is 'true' only when the signal comment was newly posted (a
      # fresh hand-off), so the AI dispatch below is idempotent via the same
      # marker. The rest describe what to dispatch.
      dispatch: ${{ steps.signal.outputs.dispatch }}
      parent: ${{ steps.signal.outputs.parent }}
      next_issue: ${{ steps.signal.outputs.next_issue }}
      next_phase: ${{ steps.signal.outputs.next_phase }}
      skill: ${{ steps.signal.outputs.skill }}
    steps:
      - name: Signal the next phase
        id: signal
        uses: actions/github-script@v7
        with:
          script: |
            const closed = context.payload.issue;
            const { owner, repo } = context.repo;

            // Default: nothing to dispatch unless we newly signal a next phase.
            core.setOutput('dispatch', 'false');

            // Phase order and the skill/inputs each downstream phase reads.
            // Kept consistent with create-phase-subissues.yml (the `inputs`
            // wording mirrors the sub-issue bodies that workflow files).
            const ORDER = ['DDD', 'BDD', 'SDD', 'TDD'];
            const NEXT = {
              BDD: {
                skill: '/bdd-feature',
                inputs: 'the parent issue + the approved DDD artifact (glossary/model diff, or its "no change" verdict).',
              },
              SDD: {
                skill: '/sdd-spec',
                inputs: 'the parent issue + the approved BDD feature (`features/<name>.feature`).',
              },
              TDD: {
                skill: '/tdd-implement',
                inputs: 'the parent issue + the approved SDD spec (`features/specs/<name>.spec.feature` + API/data-model spec).',
              },
            };

            // 1. Parse the phase key from the closed issue's title. Same prefix
            //    convention create-phase-subissues.yml writes: `[DDD] <name>`.
            const phaseMatch = closed.title.match(/^\s*\[(DDD|BDD|SDD|TDD)\]/i);
            if (!phaseMatch) {
              core.info(`#${closed.number} has the phase-subissue label but no [PHASE] title prefix; nothing to do.`);
              return;
            }
            const phase = phaseMatch[1].toUpperCase();

            // Parse the parent number from the `**Parent:** #N` body line.
            const parentMatch = (closed.body || '').match(/\*\*Parent:\*\*\s*#(\d+)/i);
            if (!parentMatch) {
              core.info(`#${closed.number} has no "**Parent:** #N" line; cannot locate the parent. Nothing to do.`);
              return;
            }
            const parentNumber = Number(parentMatch[1]);

            // Posts a comment only if `marker` is not already present on the
            // target issue (idempotent across close → reopen → close). Returns
            // true iff it actually posted (used to gate the AI dispatch).
            async function commentOnce(issueNumber, marker, lines) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: issueNumber, per_page: 100 }
              );
              if (comments.some((c) => (c.body || '').includes(marker))) {
                core.info(`Marker "${marker}" already on #${issueNumber}; skipping.`);
                return false;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [marker, ...lines].join('\n'),
              });
              core.info(`Commented on #${issueNumber} (marker "${marker}").`);
              return true;
            }

            // Sets the parent's single current-phase status label, removing any
            // other `phase:*` label so it behaves like a single-select field.
            // Labels are inherently idempotent, so no marker is needed here.
            async function setParentPhase(issueNumber, label) {
              const { data: parent } = await github.rest.issues.get({
                owner, repo, issue_number: issueNumber,
              });
              const current = (parent.labels || []).map(
                (l) => (typeof l === 'string' ? l : l.name)
              );
              for (const name of current) {
                if (name && name.startsWith('phase:') && name !== label) {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: issueNumber, name,
                  });
                }
              }
              if (current.includes(label)) {
                core.info(`Parent #${issueNumber} already has ${label}; unchanged.`);
                return;
              }
              // addLabels auto-creates the label in the repo if it is missing.
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issueNumber, labels: [label],
              });
              core.info(`Set ${label} on parent #${issueNumber}.`);
            }

            // 4. TDD is the last phase: mark the parent done. No next phase to
            //    dispatch.
            if (phase === 'TDD') {
              await setParentPhase(parentNumber, 'phase:done');
              core.info(`TDD (#${closed.number}) closed → parent #${parentNumber} marked phase:done.`);
              return;
            }

            // 2–3. Locate the next phase's sub-issue among the parent's
            //       children and signal it if it is still open.
            const nextPhase = ORDER[ORDER.indexOf(phase) + 1];
            const meta = NEXT[nextPhase];

            const subIssues = await github.paginate(
              'GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
              { owner, repo, issue_number: parentNumber, per_page: 100 }
            );

            const next = subIssues.find((s) =>
              new RegExp(`^\\s*\\[${nextPhase}\\]`, 'i').test(s.title || '')
            );

            if (!next) {
              core.info(`Parent #${parentNumber} has no [${nextPhase}] sub-issue; nothing to signal.`);
              return;
            }
            if (next.state !== 'open') {
              core.info(`Next sub-issue #${next.number} ([${nextPhase}]) is not open (state: ${next.state}); nothing to signal.`);
              return;
            }

            // Post the actionable ping on the next sub-issue: it is ready, which
            // skill to run, and its inputs.
            const posted = await commentOnce(
              next.number,
              `<!-- phase-advance:${phase}->${nextPhase} -->`,
              [
                `**${phase} closed (#${closed.number}) → this ${nextPhase} phase is ready to start.**`,
                '',
                `Run \`${meta.skill}\`, reading ${meta.inputs}`,
                '',
                '_Auto-posted by the `phase-advance` workflow. See `docs/ai-driven-development.md` §5._',
              ]
            );

            // Move the parent's current-phase status field forward.
            await setParentPhase(parentNumber, `phase:${nextPhase}`);

            // Only dispatch the AI executor when this is a fresh hand-off (the
            // comment was newly posted), so dispatch fires exactly once per
            // hand-off — tied to the same marker as the signal comment.
            if (posted) {
              core.setOutput('dispatch', 'true');
              core.setOutput('parent', String(parentNumber));
              core.setOutput('next_issue', String(next.number));
              core.setOutput('next_phase', nextPhase);
              core.setOutput('skill', meta.skill);
            }

  dispatch-next-phase:
    # Increment 2: start the next phase's agent session. Runs only when ALL of:
    #   - the signal job produced a fresh hand-off (`dispatch == 'true'`), AND
    #   - the repository variable CLAUDE_API_AUTOMATION == 'true' — the default
    #     (variable unset) keeps this paid, token-billed auto-dispatch OFF. Flip
    #     it on (Settings → Secrets and variables → Actions → Variables) for the
    #     sessions where you want the loop to advance itself, then off again, AND
    #   - the ANTHROPIC_API_KEY secret is present (checked in a step, since
    #     secrets cannot be used in a job `if:`).
    # Absent any of these the job is a clean no-op and only the increment-1
    # signal remains (no API spend, CI/forks stay green).
    #
    # On an issue trigger the action creates a new branch, commits the artifact,
    # and posts a pull-request link on the sub-issue; a human opens the draft PR
    # and reviews it — the per-phase approval gate stays. It never merges or
    # closes the sub-issue. `use_commit_signing: true` makes the commit go
    # through the action's built-in GitHub API tool instead of Bash git, so the
    # repo's `.claude/settings.json` Bash allowlist does not block it (that was
    # the increment-2.1 permission-denial fix).
    needs: advance-phase
    if: ${{ needs.advance-phase.outputs.dispatch == 'true' && vars.CLAUDE_API_AUTOMATION == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check for API key
        id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY not set; skipping auto-dispatch (signal-only, increment 1)."
          fi

      - name: Checkout
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dispatch the next-phase agent
        if: steps.check.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Commit via the action's built-in signed-commit tool, not Bash git,
          # so the repo's .claude/settings.json Bash allowlist does not block the
          # branch/commit.
          use_commit_signing: true
          # Model routing (ADR-0004): a cheaper model for routine phase drafting
          # keeps auto-dispatch inexpensive — the human review is the quality
          # gate. Also allow the file-editing tools the phase skills need; the
          # repo allowlist only pre-approves a few Bash commands, so file writes
          # would otherwise be denied in this headless run.
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Edit,Write,MultiEdit,Bash(uv run pytest:*),Bash(uv run ruff:*)"
          # Pointer seed only — the skill reads the artifacts itself from the
          # repo at HEAD + the named issues (artifact-first; see §1/§5).
          prompt: |
            The DDD→BDD→SDD→TDD pipeline (docs/ai-driven-development.md) has
            advanced: the previous phase was approved and closed. Start the next
            phase now.

            Run ${{ needs.advance-phase.outputs.skill }} for the feature tracked
            in issue #${{ needs.advance-phase.outputs.parent }}. Your phase
            sub-issue is #${{ needs.advance-phase.outputs.next_issue }}
            (${{ needs.advance-phase.outputs.next_phase }}).

            Inputs to read (follow the skill's own "Inputs to read first"
            exactly): the parent issue #${{ needs.advance-phase.outputs.parent }}
            (user story + acceptance criteria); your sub-issue
            #${{ needs.advance-phase.outputs.next_issue }} (this phase's inputs,
            artifact, and acceptance); and the previous phase's approved artifact
            from the repository at HEAD (the relevant glossary / feature / spec
            files), or — if the previous phase closed with a "no change" verdict —
            the closing comment on that phase's sub-issue.

            Produce this phase's artifact and commit it to a new branch. The
            action will surface a pull-request link on the sub-issue for a human
            to open and review the draft PR. Do NOT merge and do NOT close the
            sub-issue — the per-phase human approval gate must stay. Keep the
            change scoped to this phase only.
